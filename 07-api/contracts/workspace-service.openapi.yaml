openapi: 3.0.3
info:
  title: WorkSphere Workspace Service API
  description: API para la gestión de espacios de trabajo, proyectos de ingeniería y ciclo de vida de tareas con bloqueo por aprobación.
  version: 1.0.0
servers:
  - url: http://localhost:8082/api/v1
    description: Workspace Service Direct Local (.NET 9)
  - url: http://localhost:8000/workspace/api/v1
    description: Via Kong Gateway

paths:
  /projects:
    post:
      summary: Crear un nuevo proyecto
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La clave (key) del proyecto ya existe en el tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Listar proyectos del tenant actual
      operationId: listProjects
      responses:
        '200':
          description: Lista de proyectos autorizados para el tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'

  /projects/{projectId}/tasks:
    post:
      summary: Crear una tarea dentro de un proyecto
      operationId: createTask
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Tarea creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Proyecto no encontrado en el tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{taskId}/block:
    post:
      summary: Bloquear tarea solicitando aprobación operativa
      description: Cambia el estado de la tarea a BLOCKED_BY_APPROVAL y asocia la solicitud de workflow.
      operationId: blockTaskWithApproval
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockTaskRequest'
      responses:
        '200':
          description: Tarea bloqueada por aprobación formal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '422':
          description: La tarea ya se encuentra completada o en un estado no bloqueable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateProjectRequest:
      type: object
      required:
        - key
        - name
        - leadUserId
      properties:
        key:
          type: string
          minLength: 2
          maxLength: 10
          example: WKS
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Plataforma Core v1
        description:
          type: string
          example: Desarrollo del MVP y núcleo de operaciones
        leadUserId:
          type: string
          example: usr_carlos_991

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          example: ten_techsolutions_15d1e947
        key:
          type: string
          example: WKS
        name:
          type: string
          example: Plataforma Core v1
        description:
          type: string
        status:
          type: string
          enum: [PLANNING, ACTIVE, ON_HOLD, COMPLETED]
          example: ACTIVE
        leadUserId:
          type: string
          example: usr_carlos_991

    CreateTaskRequest:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          example: Despliegue de clúster Kubernetes en staging
        description:
          type: string
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          example: HIGH
        assigneeId:
          type: string
          example: usr_daniel_01

    BlockTaskRequest:
      type: object
      required:
        - approvalProcessType
        - reason
      properties:
        approvalProcessType:
          type: string
          enum: [BUDGET_APPROVAL, SCOPE_CHANGE, RESOURCE_ALLOCATION, TECH_VALIDATION]
          example: BUDGET_APPROVAL
        reason:
          type: string
          example: Se requiere autorización para reservar servidores de cómputo en la nube

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        projectId:
          type: string
          format: uuid
        taskNumber:
          type: string
          example: WKS-101
        title:
          type: string
        status:
          type: string
          enum: [TODO, IN_PROGRESS, BLOCKED_BY_APPROVAL, READY_FOR_REVIEW, DONE]
          example: BLOCKED_BY_APPROVAL
        priority:
          type: string
          example: HIGH
        assigneeId:
          type: string
        approvalRequestId:
          type: string
          format: uuid
          nullable: true

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 422
        error:
          type: string
          example: Unprocessable Entity
        message:
          type: string
          example: Task cannot be transitioned to BLOCKED_BY_APPROVAL from status DONE
